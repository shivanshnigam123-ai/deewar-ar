<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Deewar AR</title>
<meta name="description" content="Scan a wall and style it in AR with wallpapers, furniture and decor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: camera-first. Thin HUD on top, one bottom stack (object bar + style sheet). Ink glass panels over the live camera. */
:root{
  --ink:#111318;
  --panel:rgba(17,19,24,.84);
  --line:rgba(243,239,232,.14);
  --text:#f3efe8;
  --muted:#a7a39b;
  --brass:#e0b44c;
  --brass-ink:#1b1608;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2;background:transparent}
.xr-block,#intro{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* ---------- Intro ---------- */
#intro{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.book{position:absolute;top:0;left:0;right:0;height:60%;display:flex;gap:10px;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,19,24,0) 35%,var(--ink) 98%)}
.strip{flex:1;max-width:86px;height:var(--h);border-radius:0 0 12px 12px;background-size:180px;background-position:center top;box-shadow:0 18px 30px rgba(0,0,0,.35);animation:hang .9s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d)}
@keyframes hang{from{transform:translateY(-18%)}to{transform:none}}
.intro-card{position:relative;width:100%;max-width:560px;margin:0 auto;padding-top:20px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,15vw,88px);line-height:.92;letter-spacing:-.02em;margin:8px 0 14px;text-wrap:balance}
.lede{margin:0;color:#d8d3ca;font-size:16px;line-height:1.5;max-width:36ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{flex:1 1 150px;min-height:54px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:16px}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:14px 0 0;line-height:1.5;max-width:46ch}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brandbox{display:flex;flex-direction:column;gap:1px;padding:8px 14px;border-radius:14px;min-width:0}
.brandbox b{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em}
#total{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-right{display:flex;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));padding:8px 14px;border-radius:999px;font-size:13px;color:#e6e1d8;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---------- Scan ---------- */
.guide{position:absolute;left:0;right:0;top:26%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 1px 8px rgba(0,0,0,.6)}
.guide p{margin:0}
#guideText{font-family:var(--f-display);font-size:22px;font-weight:600;text-wrap:balance}
.guide .sub{font-size:14px;color:#e2ddd4}
.sweep{width:120px;height:64px;position:relative;margin-bottom:8px}
.sweep span{position:absolute;left:44px;top:4px;width:32px;height:56px;border:2px solid var(--text);border-radius:8px;animation:sweep 2.2s ease-in-out infinite alternate}
.sweep span::after{content:"";position:absolute;left:50%;bottom:4px;width:8px;height:2px;margin-left:-4px;background:var(--text);border-radius:2px}
@keyframes sweep{from{transform:translateX(-36px) rotate(-8deg)}to{transform:translateX(36px) rotate(8deg)}}
.guide.found .sweep{visibility:hidden}
.scanbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock{min-width:220px;min-height:56px;border-radius:999px;border:0;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,opacity .2s}
.lock:disabled{background:rgba(243,239,232,.2);color:rgba(243,239,232,.75);box-shadow:none}
.lock:active:not(:disabled){transform:scale(.97)}
.link{border:0;background:rgba(17,19,24,.55);padding:8px 14px;border-radius:999px;font-size:13.5px;color:#e6e1d8;text-decoration:underline;text-underline-offset:3px}

/* ---------- Bottom stack ---------- */
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.roombtn{align-self:center;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.roombtn:disabled{opacity:.7}
.objbar{align-self:center;display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;border-radius:20px;max-width:calc(100% - 32px)}
.objbar .meta{display:flex;justify-content:space-between;gap:12px;padding:0 6px;font-size:13px;min-width:0}
.objbar .meta .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objbar .meta .pr{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.act{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;padding:8px 6px;border:0;background:transparent;border-radius:12px;font-size:11.5px;font-weight:500}
.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.act:active{background:rgba(243,239,232,.1)}
.act.primary{flex-direction:row;gap:8px;background:var(--brass);color:var(--brass-ink);font-size:15px;font-weight:700;padding:0 22px;min-height:48px;margin-left:6px}
.sheet{border-radius:22px 22px 0 0;border-bottom:0;border-left:0;border-right:0;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:rgba(243,239,232,.11);color:var(--text)}
.tray{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-snap-type:x proximity;scroll-padding-inline:16px}
.tray::-webkit-scrollbar,.tabs::-webkit-scrollbar,.acts::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:84px;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.thumb{width:100%;height:72px;border-radius:14px;background-color:rgba(243,239,232,.06);border:1.5px solid transparent;display:grid;place-items:center;background-size:cover;background-position:center;overflow:hidden}
.thumb svg{width:36px;height:36px;fill:none;stroke:var(--text);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card.on .thumb{border-color:var(--brass)}
.card:active .thumb{transform:scale(.97)}
.card .nm{font-size:12.5px;line-height:1.25;font-weight:600}
.card .pr{font-size:11.5px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.card.style{width:158px}
.card.style .thumb{display:flex}
.sw{flex:1;height:100%}
.card.wctl{width:116px}
.thumb.ctl{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.wv{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.strip,.sweep span{animation:none}.toast{transition:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="ui">
  <section id="intro">
    <div class="book" id="book" aria-hidden="true"></div>
    <div class="intro-card">
      <p class="eyebrow">दीवार · AR interior styling</p>
      <h1>Deewar</h1>
      <p class="lede">Scan a wall in your room, then try wallpapers, furniture and decor on it before you buy anything.</p>
      <div class="actions">
        <button id="btnAR" class="btn primary">Start AR</button>
        <button id="btnPreview" class="btn">Try 3D preview</button>
      </div>
      <p id="support" class="note">Checking AR support on this device…</p>
    </div>
  </section>

  <header id="hud" class="hud" hidden>
    <div class="brandbox glass xr-block"><b>Deewar</b><span id="total">₹0 · 0 pieces</span></div>
    <div class="hud-right xr-block">
      <button id="btnRescan" class="chip glass" hidden>Rescan</button>
      <button id="btnExit" class="chip glass">Exit AR</button>
    </div>
  </header>
  <div id="hint" class="hint glass" hidden></div>

  <div id="guide" class="guide" hidden>
    <div class="sweep" aria-hidden="true"><span></span></div>
    <p id="guideText">Point at a wall and move slowly</p>
    <p id="guideSub" class="sub"></p>
  </div>
  <div id="scanBar" class="scanbar" hidden>
    <button id="btnAlt" class="link xr-block">Wall not found? Use the floor instead</button>
    <button id="btnLock" class="lock xr-block" disabled><span id="lockLabel">Lock wall</span></button>
  </div>

  <div id="bottom" class="bottom" hidden>
    <button id="btnRoom" class="roombtn xr-block" hidden>View in your room</button>
    <div id="objBar" class="objbar glass xr-block" hidden></div>
    <nav class="sheet glass xr-block" aria-label="Styling options">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="styles">Styles</button>
        <button class="tab" role="tab" data-tab="wallpaper">Wallpaper</button>
        <button class="tab" role="tab" data-tab="furniture">Furniture</button>
        <button class="tab" role="tab" data-tab="decor">Decor</button>
      </div>
      <div id="tray" class="tray"></div>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

// iPhone / iPad cannot run WebXR. There we hand the styled room to Apple's AR Quick Look instead.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let QL = IOS;
try { QL = QL || document.createElement('a').relList.supports('ar'); } catch (e) {}

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const WALL_H = 2.7; // wallpaper height in metres

/* =========================================================
   STATE
   ========================================================= */
const S = {
  mode:'intro',          // intro | scan | style
  ar:false,
  scanMethod:'wall',     // wall (wall then floor) | floor (floor only)
  scanTarget:'wall',
  candidate:null, found:false,
  wallPoint:null, wallNormal:null,
  wallpaper:'none', wallW:3.6, wallAnim:null,
  preset:null, tab:'styles',
  placing:null, selected:null,
  pointer:new THREE.Vector2(0,0),
};

/* =========================================================
   RENDERER + SCENE
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
renderer.domElement.id = 'gl';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x8a7f72, 0.7));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.6; controls.maxDistance = 7.5;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minAzimuthAngle = -Math.PI/2.6; controls.maxAzimuthAngle = Math.PI/2.6;
controls.enabled = false;

/* The "room" is anchored at the base of the scanned wall.
   Local axes: +X along the wall, +Y up, +Z out of the wall into the room. */
const room = new THREE.Group(); room.visible = false; scene.add(room);
const items = new THREE.Group(); room.add(items);

const sun = new THREE.DirectionalLight(0xfff1dd, 1.5);
sun.position.set(1.8, 3.6, 3.2); sun.target.position.set(0, 0, 1);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-3.5, right:3.5, top:3.5, bottom:-3.5, near:0.5, far:12 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
room.add(sun, sun.target);

const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(10,10).rotateX(-Math.PI/2), new THREE.ShadowMaterial({ opacity:0.28 }));
shadowCatcher.position.y = 0.001; shadowCatcher.receiveShadow = true; shadowCatcher.userData.noPick = true;
room.add(shadowCatcher);

// Wallpaper: a plane on the wall that "unrolls" from the top.
const wallRoll = new THREE.Group(); wallRoll.position.y = WALL_H; room.add(wallRoll);
const wallMat = new THREE.MeshStandardMaterial({ roughness:0.95, envMapIntensity:0.35 });
const wallMesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), wallMat);
wallMesh.position.z = 0.004; wallMesh.receiveShadow = true; wallMesh.visible = false; wallMesh.userData.noPick = true;
wallRoll.add(wallMesh);

// Fake room used only by the 3D preview (no camera feed there).
const previewSet = new THREE.Group(); previewSet.visible = false; room.add(previewSet);
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14,14).rotateX(-Math.PI/2), M('#b8afa2', 0.9));
  floor.receiveShadow = true; previewSet.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(14,6), M('#e7e2da', 0.95));
  wall.position.set(0,3,-0.001); wall.receiveShadow = true; previewSet.add(wall);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(14,0.08,0.015), M('#f4f1ec', 0.6));
  skirt.position.set(0,0.04,0.0075); skirt.receiveShadow = true; previewSet.add(skirt);
  previewSet.traverse(o => o.userData.noPick = true);
}

// Scan reticle (lies flat on whatever surface the hit-test found).
const reticle = new THREE.Group(); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
{
  const mat = new THREE.MeshBasicMaterial({ color:0xe0b44c });
  reticle.add(new THREE.Mesh(new THREE.RingGeometry(0.09,0.115,48).rotateX(-Math.PI/2), mat));
  reticle.add(new THREE.Mesh(new THREE.CircleGeometry(0.018,24).rotateX(-Math.PI/2), mat));
}

// Selection rings
const ringMat = new THREE.MeshBasicMaterial({ color:0xe0b44c, transparent:true, opacity:0.95, side:THREE.DoubleSide });
const selFloor = new THREE.Mesh(new THREE.RingGeometry(0.94,1,72).rotateX(-Math.PI/2), ringMat);
const selWall  = new THREE.Mesh(new THREE.RingGeometry(0.95,1,72), ringMat);
selFloor.userData.noPick = selWall.userData.noPick = true;

/* =========================================================
   GEOMETRY + MATERIAL HELPERS
   ========================================================= */
function M(color, rough=0.85, metal=0){ return new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal, envMapIntensity:0.55 }); }
const BRASS='#c9a24a', DARK='#2a2622', WOOD='#8a5a3c', WALNUT='#6b4430', RATTAN='#b88b52';
const isBrass = c => c === BRASS;
const finish = c => isBrass(c) ? M(c,0.32,0.85) : M(c,0.6);
const BX = (w,h,d) => new THREE.BoxGeometry(w,h,d);
const RB = (w,h,d,r=0.04) => new RoundedBoxGeometry(w,h,d,3,r);
const CY = (rt,rb,h,s=32) => new THREE.CylinderGeometry(rt,rb,h,s);
function add(g, geo, mat, x=0, y=0, z=0){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; g.add(m); return m; }
function rng(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647, (s - 1) / 2147483646); }

/* =========================================================
   CANVAS TEXTURES (wallpapers, rugs, prints)
   ========================================================= */
const cache = new Map();
const cached = (k, fn) => { if (!cache.has(k)) cache.set(k, fn()); return cache.get(k); };
function cv(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, repeat=false){ const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function wrap(size, x, y, fn){ for (const dx of [-size,0,size]) for (const dy of [-size,0,size]) fn(x+dx, y+dy); }

const PAT = {
  blockprint(x){ // Sanganeri-style buta, half-drop repeat
    x.fillStyle='#f1e9d8'; x.fillRect(0,0,512,512);
    const motif = (cx,cy) => {
      x.save(); x.translate(cx,cy);
      x.fillStyle='#2e3d70';
      for (let k=0;k<8;k++){ x.save(); x.rotate(k*Math.PI/4); x.beginPath(); x.ellipse(0,-21,6.5,14,0,0,Math.PI*2); x.fill(); x.restore(); }
      x.fillStyle='#b5523b'; x.beginPath(); x.arc(0,0,9,0,Math.PI*2); x.fill();
      x.fillStyle='#f1e9d8'; x.beginPath(); x.arc(0,0,3.5,0,Math.PI*2); x.fill();
      x.fillStyle='#2e3d70';
      for (let k=0;k<4;k++){ const a=k*Math.PI/2+Math.PI/4; x.beginPath(); x.arc(Math.cos(a)*40,Math.sin(a)*40,2.6,0,Math.PI*2); x.fill(); }
      x.restore();
    };
    for (let c=0;c<4;c++) for (let r=0;r<4;r++){
      const cx=c*128+64, cy=r*128+64+(c%2?64:0);
      wrap(512,cx,cy,motif);
    }
  },
  limewash(x){
    x.fillStyle='#b7bea4'; x.fillRect(0,0,512,512);
    const r = rng(7);
    for (let i=0;i<260;i++){
      const px=r()*512, py=r()*512, rad=30+r()*90, light=r()>0.5, a=0.04+r()*0.05;
      const col = light ? '255,255,242' : '70,82,58';
      wrap(512,px,py,(X,Y)=>{ const g=x.createRadialGradient(X,Y,0,X,Y,rad); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`); x.fillStyle=g; x.fillRect(X-rad,Y-rad,rad*2,rad*2); });
    }
  },
  arches(x){ // jharokha arches
    x.fillStyle='#dcc6ab'; x.fillRect(0,0,512,512);
    for (let c=0;c<4;c++) for (let r=0;r<4;r++){
      const ox=c*128, oy=r*128;
      x.fillStyle='rgba(168,103,74,.16)';
      x.beginPath(); x.moveTo(ox+42,oy+116); x.lineTo(ox+42,oy+62); x.arc(ox+64,oy+62,22,Math.PI,0); x.lineTo(ox+86,oy+116); x.closePath(); x.fill();
      x.strokeStyle='#a8674a'; x.lineWidth=4;
      x.beginPath(); x.moveTo(ox+28,oy+116); x.lineTo(ox+28,oy+58); x.arc(ox+64,oy+58,36,Math.PI,0); x.lineTo(ox+100,oy+116); x.stroke();
      x.fillStyle='#a8674a'; x.beginPath(); x.arc(ox+64,oy+12,3,0,Math.PI*2); x.fill();
    }
  },
  cane(x){ // rattan weave
    x.fillStyle='#4a3620'; x.fillRect(0,0,512,512);
    x.strokeStyle='#dcc191'; x.lineWidth=6;
    for (let k=0;k<=512;k+=32){ x.beginPath(); x.moveTo(k,0); x.lineTo(k,512); x.stroke(); x.beginPath(); x.moveTo(0,k); x.lineTo(512,k); x.stroke(); }
    x.strokeStyle='#cbae78'; x.lineWidth=4;
    for (let k=-512;k<=1024;k+=32){ x.beginPath(); x.moveTo(k,0); x.lineTo(k+512,512); x.stroke(); x.beginPath(); x.moveTo(k,0); x.lineTo(k-512,512); x.stroke(); }
  },
  terrazzo(x){
    x.fillStyle='#ece6dc'; x.fillRect(0,0,512,512);
    const r = rng(11), cols=['#c9744f','#8aa39b','#d8b25c','#6e6a64','#ffffff','#c9744f'];
    for (let i=0;i<190;i++){
      const px=r()*512, py=r()*512, size=3+Math.pow(r(),2)*16, col=cols[Math.floor(r()*cols.length)], n=5+Math.floor(r()*3), rot=r()*6.28;
      const radii = Array.from({length:n}, () => size*(0.6+r()*0.5));
      wrap(512,px,py,(X,Y)=>{ x.fillStyle=col; x.beginPath(); for(let j=0;j<n;j++){ const a=rot+j/n*Math.PI*2; const fx=X+Math.cos(a)*radii[j], fy=Y+Math.sin(a)*radii[j]; j?x.lineTo(fx,fy):x.moveTo(fx,fy);} x.closePath(); x.fill(); });
    }
  },
  pinstripe(x){
    x.fillStyle='#ebe5d9'; x.fillRect(0,0,512,512);
    for (let i=0;i<8;i++){ const X=i*64; x.fillStyle='#d3c8b5'; x.fillRect(X,0,26,512); x.fillStyle='#8f826c'; x.fillRect(X+40,0,2,512); }
  },
  indigo(x){
    x.fillStyle='#2c3a63'; x.fillRect(0,0,512,512);
    const r = rng(5);
    for (let i=0;i<3000;i++){ x.fillStyle = r()>0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)'; x.fillRect(r()*512, r()*512, 2, 2); }
  },
};

function rugTex(i){
  return cached('rug'+i, () => {
    const P = [
      { bg:'#b5523b', a:'#f1e4cc', b:'#2e3d70', c:'#d9a441' },
      { bg:'#2e3d70', a:'#e9dcc4', b:'#b5523b', c:'#9aa58c' },
      { bg:'#d8ccb6', a:'#7d6c55', b:'#f4efe6', c:'#a8674a' },
    ][i % 3];
    const [c,x] = cv(512,358);
    x.fillStyle=P.bg; x.fillRect(0,0,512,358);
    x.strokeStyle=P.a; x.lineWidth=10; x.strokeRect(16,16,480,326);
    x.strokeStyle=P.b; x.lineWidth=4; x.strokeRect(32,32,448,294);
    for (const y of [72, 286]) { x.fillStyle=P.c; for (let k=0;k<15;k++){ const X=48+k*29; x.beginPath(); x.moveTo(X,y-9); x.lineTo(X+14,y+9); x.lineTo(X-14,y+9); x.closePath(); x.fill(); } }
    for (let k=0;k<6;k++){ const X=86+k*68, Y=179;
      x.fillStyle=P.a; x.beginPath(); x.moveTo(X,Y-40); x.lineTo(X+28,Y); x.lineTo(X,Y+40); x.lineTo(X-28,Y); x.closePath(); x.fill();
      x.fillStyle=P.b; x.beginPath(); x.moveTo(X,Y-18); x.lineTo(X+13,Y); x.lineTo(X,Y+18); x.lineTo(X-13,Y); x.closePath(); x.fill(); }
    return tex(c);
  });
}
function artTex(kind){

      x.fillStyle='#efe6d6'; x.fillRect(0,0,312,432);

      x.fillStyle='#efe6d6'; x.beginPath(); x.moveTo(116,380); x.lineTo(116,236); x.arc(156,236,40,Math.PI,0); x.lineTo(196,380); x.closePath(); x.fill();
      x.fillStyle='#d9a441'; x.beginPath(); x.arc(156,266,20,0,Math.PI*2); x.fill();
      x.fillStyle='#2e3d70'; x.fillRect(0,380,312,52);
    } else {
      x.fillStyle='#f3eee5'; x.fillRect(0,0,312,432);
      x.fillStyle='#d9a441'; x.beginPath(); x.arc(156,170,84,0,Math.PI*2); x.fill();
      x.fillStyle='#2e3d70'; for (let i=0;i<5;i++) x.fillRect(40+i*16, 282+i*24, 232-i*32, 8);

function weaveTex(i){
  return cached('weave'+i, () => {
    const main = ['#b5523b','#2e3d70','#7f8c6c'][i % 3];
    const [c,x] = cv(280,400);
    x.fillStyle=main; x.fillRect(0,0,280,400);
    x.strokeStyle='#efe6d6'; x.lineWidth=6; x.lineJoin='miter';
    for (const y of [50,150,250,350]) { x.beginPath(); for (let k=0;k<=14;k++){ const X=k*20, Y=y+(k%2?12:-12); k?x.lineTo(X,Y):x.moveTo(X,Y);} x.stroke(); }
    x.fillStyle='#d9a441';
    for (const y of [100,200,300]) for (let k=0;k<5;k++){ const X=40+k*50; x.beginPath(); x.moveTo(X,y-10); x.lineTo(X+10,y); x.lineTo(X,y+10); x.lineTo(X-10,y); x.closePath(); x.fill(); }
    return tex(c);
  });
}

function makeItem(id, ci=0){
  const c = CAT[id], idx = ((ci % c.colors.length) + c.colors.length) % c.colors.length;
  const g = c.build(c.colors[idx], idx);
  const size = new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());
  g.userData = { catId:id, colorIdx:idx, mount:c.mount, size };
  return g;
}
function dispose(o){
  o.traverse(m => { if (m.isMesh && !m.userData.noPick){ m.geometry.dispose(); [].concat(m.material).forEach(x => x.dispose()); } });
}

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} }
const defaultHint = () => S.ar ? 'Tap a piece to move, recolour or swap it' : 'Drag to look around · tap a piece to edit it';
function setHint(t){ $('#hint').textContent = t; }

function showUI(mode){
  S.mode = mode;
  $('#intro').hidden = mode !== 'intro';
  $('#hud').hidden = mode === 'intro';
  $('#guide').hidden = mode !== 'scan';
  $('#scanBar').hidden = mode !== 'scan';
  $('#bottom').hidden = mode !== 'style';
  $('#hint').hidden = mode !== 'style';
  $('#total').hidden = mode !== 'style';
  $('#btnRescan').hidden = !(mode === 'style' && S.ar);
  $('#btnExit').textContent = S.ar ? 'Exit AR' : 'Back';
  updateRoomBtn();
}
function updateRoomBtn(){ $('#btnRoom').hidden = !(S.mode === 'style' && !S.ar && QL) || !!S.placing || !!S.selected; }

function renderTray(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
  let h = '';
  if (S.tab === 'styles'){
    h = PRESETS.map(p => `<button class="card style ${S.preset===p.id?'on':''}" data-preset="${p.id}"><span class="thumb">${p.sw.map(c=>`<i class="sw" style="background:${c}"></i>`).join('')}</span><span class="nm">${p.name}</span><span class="pr">${p.note}</span></button>`).join('');
  } else if (S.tab === 'wallpaper'){
    h = `<div class="card wctl"><span class="thumb ctl"><button class="step" data-w="-0.3" aria-label="Narrower wall">−</button><span class="wv">${S.wallW.toFixed(1)} m</span><button class="step" data-w="0.3" aria-label="Wider wall">+</button></span><span class="nm">Wall width</span><span class="pr">${(S.wallW*WALL_H).toFixed(1)} m² to cover</span></div>`
      + WALLS.map(w => `<button class="card ${S.wallpaper===w.id?'on':''}" data-wall="${w.id}"><span class="thumb" ${w.id==='none'?'':`style="background-image:url(${thumb(w.id)})"`}>${w.id==='none'?ICON.none:''}</span><span class="nm">${w.name}</span><span class="pr">${w.price?inr(w.price)+' / m²':'Keep as is'}</span></button>`).join('');
  } else {
    h = Object.entries(CAT).filter(([,v]) => v.cat === S.tab).map(([k,v]) => `<button class="card" data-add="${k}"><span class="thumb">${ICON[v.icon]}</span><span class="nm">${v.name}</span><span class="pr">${inr(v.price)}</span></button>`).join('');
  }
  $('#tray').innerHTML = h;
}

function renderObjBar(){
  const bar=$('#objBar'), p=S.placing, o=S.selected;
  updateRoomBtn();
  if (!p && !o){ bar.hidden = true; return; }
  bar.hidden = false;
  const d=(p?p.obj:o).userData, c=CAT[d.catId];
  const meta = `<div class="meta"><span class="nm">${c.name}</span><span class="pr">${c.cn[d.colorIdx]} · ${inr(c.price)}</span></div>`;
  const A = (act,label) => `<button class="act" data-act="${act}">${ICON[act]}<span>${label}</span></button>`;
  bar.innerHTML = p
    ? meta + `<div class="acts"><button class="act" data-act="cancel">${ICON.x}<span>Cancel</span></button><button class="act primary" data-act="place">${ICON.check}<span>Place here</span></button></div>`
    : meta + `<div class="acts">${A('move','Move')}${d.mount==='floor'?A('turn','Turn'):''}${A('colour','Colour')}${A('swap','Swap')}${A('remove','Remove')}<button class="act" data-act="done">${ICON.check}<span>Done</span></button></div>`;
}

function updateTotal(){
  let sum=0, n=0;
  items.children.forEach(o => { if (S.placing && S.placing.isNew && S.placing.obj === o) return; sum += CAT[o.userData.catId].price; n++; });
  const wp = WALLS.find(w => w.id === S.wallpaper);
  if (wp && wp.price) sum += Math.round(wp.price * S.wallW * WALL_H / 50) * 50;
  $('#total').textContent = `${inr(sum)} · ${n} piece${n===1?'':'s'}`;
}

/* =========================================================
   WALLPAPER
   ========================================================= */
const curWall = () => WALLS.find(w => w.id === S.wallpaper);
function setWallReveal(k){
  const h = Math.max(0.001, WALL_H*k), wp = curWall();
  wallMesh.scale.set(S.wallW, h, 1);
  wallMesh.position.y = -h/2;
  if (wallMat.map && wp && wp.tile){ wallMat.map.repeat.set(S.wallW/wp.tile, h/wp.tile); wallMat.map.offset.set(0, (WALL_H-h)/wp.tile); }
}
function setWallpaper(id){
  S.wallpaper = id;
  if (id === 'none'){ wallMesh.visible = false; S.wallAnim = null; return; }
  wallMat.map = wallTex(id); wallMat.color.set('#ffffff'); wallMat.needsUpdate = true;
  wallMesh.visible = true;
  S.wallAnim = performance.now(); setWallReveal(RM ? 1 : 0.001);
}

/* =========================================================
   ITEMS: add, place, select, edit
   ========================================================= */
function addItem(o, delay=0){ o.scale.setScalar(0.001); o.userData.popT0 = performance.now() + delay; items.add(o); }
function clearItems(){
  if (S.placing) cancelPlacing();
  deselect();
  [...items.children].forEach(o => { items.remove(o); dispose(o); });
}
function applyPreset(p){
  clearItems();
  S.preset = p.id; setWallpaper(p.wall);
  p.items.forEach((it,i) => {
    const o = makeItem(it.id, it.c);
    if (o.userData.mount === 'wall') o.position.set(it.x, it.y, 0); else o.position.set(it.x, 0, it.z);
    o.rotation.y = it.r || 0;
    addItem(o, (RM ? 0 : 350) + i*110);
  });
  renderTray(); updateTotal(); toast(p.name);
}

function setGhost(o, on){
  o.traverse(m => { if (!m.isMesh) return; [].concat(m.material).forEach(mt => { mt.transparent = on; mt.opacity = on ? 0.55 : 1; mt.depthWrite = !on; mt.needsUpdate = true; }); });
}
function startPlacing(obj, isNew){
  if (S.placing) cancelPlacing();
  deselect();
  S.placing = { obj, isNew, orig: obj.position.clone() };
  const wall = obj.userData.mount === 'wall';
  if (isNew){ obj.position.set(0, wall?1.5:0, wall?0:1.2); items.add(obj); }
  setGhost(obj, true);
  if (!S.ar){ S.pointer.set(0, wall ? 0.15 : -0.45); controls.enabled = false; }
  renderObjBar();
  setHint(S.ar ? (wall ? 'Aim at the wall, then tap Place here' : 'Aim at the floor, then tap Place here') : 'Drag to position it, then tap Place here');
  updateTotal();
}
function confirmPlace(){
  const p = S.placing; if (!p) return;
  S.placing = null; setGhost(p.obj, false);
  if (p.isNew){ p.obj.scale.setScalar(0.001); p.obj.userData.popT0 = performance.now(); }
  if (!S.ar) controls.enabled = true;
  S.preset = null; select(p.obj); buzz(); toast('Placed'); updateTotal(); if (S.tab==='styles') renderTray();
}
function cancelPlacing(){
  const p = S.placing; if (!p) return;
  S.placing = null;
  if (p.isNew){ items.remove(p.obj); dispose(p.obj); } else { setGhost(p.obj, false); p.obj.position.copy(p.orig); }
  if (!S.ar && S.mode === 'style') controls.enabled = true;
  renderObjBar(); setHint(defaultHint()); updateTotal();
}
function select(o){
  deselect();
  S.selected = o;
  const s = o.userData.size;
  if (o.userData.mount === 'floor'){ selFloor.scale.setScalar(Math.max(s.x, s.z)/2 + 0.08); selFloor.position.set(0, 0.012, 0); o.add(selFloor); }
  else { selWall.scale.setScalar(Math.max(s.x, s.y)/2 + 0.06); selWall.position.set(0, 0, 0.006); o.add(selWall); }
  renderObjBar(); setHint(defaultHint());
}
function deselect(){
  if (selFloor.parent) selFloor.parent.remove(selFloor);
  if (selWall.parent) selWall.parent.remove(selWall);
  S.selected = null; renderObjBar();
}
function replaceItem(o, id, ci){
  const n = makeItem(id, ci);
  n.position.copy(o.position); n.rotation.copy(o.rotation);
  if (n.userData.mount === 'floor') n.position.z = Math.max(n.position.z, n.userData.size.z/2 + 0.02);
  deselect(); items.remove(o); dispose(o);
  addItem(n, 0); select(n); S.preset = null; updateTotal();
}
function onAct(act){
  const o = S.selected;
  if (act === 'place') return confirmPlace();
  if (act === 'cancel') return cancelPlacing();
  if (!o) return;
  const d = o.userData;
  if (act === 'move') startPlacing(o, false);
  else if (act === 'turn'){ o.rotation.y += Math.PI/4; buzz(); }
  else if (act === 'colour') replaceItem(o, d.catId, d.colorIdx + 1);
  else if (act === 'swap'){ const keys = Object.keys(CAT).filter(k => CAT[k].cat === CAT[d.catId].cat); replaceItem(o, keys[(keys.indexOf(d.catId)+1) % keys.length], 0); }
  else if (act === 'remove'){ deselect(); items.remove(o); dispose(o); S.preset = null; updateTotal(); toast('Removed'); }
  else if (act === 'done') deselect();
}

/* =========================================================
   AIMING + PICKING
   ========================================================= */
const raycaster = new THREE.Raycaster();
const _o = new THREE.Vector3(), _d = new THREE.Vector3(), _inv = new THREE.Matrix4();
function aimRay(){
  if (S.ar){ camera.updateMatrixWorld(); _o.setFromMatrixPosition(camera.matrixWorld); _d.set(0,0,-1).transformDirection(camera.matrixWorld); }
  else { raycaster.setFromCamera(S.pointer, camera); _o.copy(raycaster.ray.origin); _d.copy(raycaster.ray.direction); }
}
function updateAim(){
  const obj = S.placing.obj, sz = obj.userData.size;
  aimRay(); room.updateMatrixWorld(); _inv.copy(room.matrixWorld).invert();
  const o = _o.clone().applyMatrix4(_inv), d = _d.clone().transformDirection(_inv);
  if (obj.userData.mount === 'floor'){
    if (d.y > -1e-3) return;
    const t = -o.y / d.y;
    obj.position.set(clamp(o.x+d.x*t, -4, 4), 0, clamp(o.z+d.z*t, sz.z/2+0.02, 6));
  } else {
    if (Math.abs(d.z) < 1e-3) return;
    const t = -o.z / d.z; if (t < 0) return;
    obj.position.set(clamp(o.x+d.x*t, -3, 3), clamp(o.y+d.y*t, sz.y/2+0.3, WALL_H-sz.y/2), 0);
  }
}
function pickFromRay(origin, dir){
  raycaster.set(origin, dir);
  for (const h of raycaster.intersectObjects(items.children, true)){
    if (h.object.userData.noPick) continue;
    let o = h.object; while (o.parent && o.parent !== items) o = o.parent;
    if (o.parent === items) return o;
  }
  return null;
}

/* =========================================================
   AR SESSION + SCANNING
   ========================================================= */
let xrSession = null, refSpace = null, hitSource = null;

async function startAR(){
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay'], domOverlay:{ root: $('#ui') }
    });
    xrSession = session; S.ar = true;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    refSpace = renderer.xr.getReferenceSpace();
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
    session.addEventListener('select', onXRSelect);
    session.addEventListener('end', onXREnd);
    scene.background = null; previewSet.visible = false; shadowCatcher.visible = true; controls.enabled = false;
    enterScan('wall');
  } catch (err) {
    S.ar = false;
    toast('AR could not start. Try the 3D preview.');
    console.error(err);
  }
}
function onXREnd(){ hitSource = null; xrSession = null; S.ar = false; reticle.visible = false; goIntro(); }

function enterScan(method){
  clearItems(); room.visible = false;
  S.scanMethod = method; S.scanTarget = method === 'wall' ? 'wall' : 'floor';
  S.candidate = null; S.found = false;
  showUI('scan'); updateScanUI();
}
function updateScanUI(){
  const wall = S.scanTarget === 'wall', f = S.found;
  $('#guide').classList.toggle('found', f);
  $('#guideText').textContent = f ? (wall ? 'Wall found' : 'Floor found')
    : wall ? 'Point at a wall and move slowly'
    : S.scanMethod === 'floor' ? 'Point at the floor where it meets the wall' : 'Now point at the floor below that wall';
  $('#guideSub').textContent = f ? 'Hold steady and tap Lock' : wall ? 'Walls with texture, art or switches are found faster' : 'Sweep your phone gently from side to side';
  $('#lockLabel').textContent = wall ? 'Lock wall' : 'Lock floor';
  $('#btnLock').disabled = !f;
  $('#btnAlt').hidden = !wall;
}
const _m = new THREE.Matrix4(), _n = new THREE.Vector3();
function handleHits(frame){
  let found = null;
  for (const r of frame.getHitTestResults(hitSource)){
    const pose = r.getPose(refSpace); if (!pose) continue;
    _m.fromArray(pose.transform.matrix);
    _n.setFromMatrixColumn(_m, 1).normalize();       // pose Y axis = surface normal
    const vertical = Math.abs(_n.y) < 0.35, horizontal = _n.y > 0.8;
    if ((S.scanTarget === 'wall' && vertical) || (S.scanTarget === 'floor' && horizontal)){
      found = { m:_m.clone(), n:_n.clone(), pos:new THREE.Vector3().setFromMatrixPosition(_m) }; break;
    }
  }
  S.candidate = found;
  reticle.visible = !!found; if (found) reticle.matrix.copy(found.m);
  if (!!found !== S.found){ S.found = !!found; updateScanUI(); }
}
function lock(){
  const c = S.candidate; if (!c) return;
  camera.updateMatrixWorld();
  const cam = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
  buzz();
  if (S.scanTarget === 'wall'){
    const n = c.n.clone(); n.y = 0; n.normalize();
    if (n.dot(cam.clone().sub(c.pos)) < 0) n.negate();   // make the normal face the user
    S.wallPoint = c.pos.clone(); S.wallNormal = n;
    S.scanTarget = 'floor'; S.candidate = null; S.found = false; updateScanUI(); toast('Wall locked');
    return;
  }
  let wp, n;
  if (S.scanMethod === 'floor'){ wp = c.pos.clone(); n = cam.clone().sub(c.pos); n.y = 0; n.normalize(); }
  else { wp = S.wallPoint; n = S.wallNormal; }
  room.position.set(wp.x, c.pos.y, wp.z);
  room.rotation.set(0, Math.atan2(n.x, n.z), 0);
  room.visible = true; reticle.visible = false;
  enterStyle();
  applyPreset(PRESETS[0]);
}
function onXRSelect(e){
  if (S.mode === 'scan'){ if (S.candidate) lock(); return; }
  if (S.mode !== 'style') return;
  if (S.placing){ confirmPlace(); return; }
  const pose = e.frame.getPose(e.inputSource.targetRaySpace, refSpace); if (!pose) return;
  const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
  const hit = pickFromRay(new THREE.Vector3().setFromMatrixPosition(m), new THREE.Vector3(0,0,-1).transformDirection(m));
  hit ? select(hit) : deselect();
}

/* =========================================================
   PREVIEW MODE (laptop / iPhone / no AR)
   ========================================================= */
function startPreview(){
  S.ar = false;
  room.position.set(0,0,0); room.rotation.set(0,0,0); room.visible = true;
  previewSet.visible = true; shadowCatcher.visible = false;
  scene.background = new THREE.Color('#1d2027');
  camera.fov = innerWidth < 600 ? 62 : 50; camera.updateProjectionMatrix();
  camera.position.set(0.4, 1.6, innerWidth < 600 ? 6.4 : 4.6);
  controls.target.set(0, 1.0, 0.9); controls.enabled = true; controls.update();
  enterStyle();
  applyPreset(PRESETS[0]);
}
function enterStyle(){ S.tab = 'styles'; showUI('style'); renderTray(); setHint(defaultHint()); updateTotal(); }
function goIntro(){
  clearItems(); setWallpaper('none');
  room.visible = false; previewSet.visible = false; controls.enabled = false; scene.background = null;
  showUI('intro');
}

/* =========================================================
   iPHONE MODE — export the styled room and open it in AR Quick Look
   ========================================================= */
function bakedWallTex(){   // Quick Look handles tiled textures badly, so draw the whole wall into one image
  const wp = curWall(), ppm = 320;
  const [c,x] = cv(Math.round(S.wallW*ppm), Math.round(WALL_H*ppm));
  const s = wp.tile*ppm/512;
  x.scale(s,s); x.fillStyle = x.createPattern(tileCanvas(wp.id), 'repeat'); x.fillRect(0, 0, c.width/s, c.height/s);
  return tex(c);
}
async function viewInRoom(){
  const btn = $('#btnRoom'); if (btn.disabled) return;
  if (S.placing) cancelPlacing();
  deselect();
  btn.hidden = false; btn.disabled = true; btn.textContent = 'Preparing…';
  const temp = [];
  try {
    const out = new THREE.Scene();
    for (const o of items.children){ const c = o.clone(true); c.scale.setScalar(1); out.add(c); }
    if (S.wallpaper !== 'none'){
      const t = bakedWallTex(), g = new THREE.PlaneGeometry(S.wallW, WALL_H), m = new THREE.MeshStandardMaterial({ map:t, roughness:0.95 });
      const w = new THREE.Mesh(g, m); w.position.set(0, WALL_H/2, -0.002); out.add(w); temp.push(t, g, m);
    }
    out.updateMatrixWorld(true);
    const data = await new USDZExporter().parse(out, { quickLookCompatible:true });
    const url = URL.createObjectURL(new Blob([data], { type:'model/vnd.usdz+zip' }));
    const a = document.createElement('a');
    a.rel = 'ar'; a.appendChild(document.createElement('img'));   // Quick Look needs an <img> inside the link
    a.href = url; a.download = 'deewar-room.usdz'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (err) {
    console.error(err); toast('Could not open the AR view. Try again.');
  } finally {
    temp.forEach(d => d.dispose());
    btn.disabled = false; btn.textContent = 'View in your room';
  }
}

const down = { x:0, y:0 };
const setPointer = e => S.pointer.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
renderer.domElement.addEventListener('pointerdown', e => { down.x = e.clientX; down.y = e.clientY; if (S.placing && !S.ar) setPointer(e); });
renderer.domElement.addEventListener('pointermove', e => { if (S.placing && !S.ar) setPointer(e); });
renderer.domElement.addEventListener('pointerup', e => {
  if (S.ar || S.mode !== 'style') return;
  if (Math.hypot(e.clientX-down.x, e.clientY-down.y) > 6) return; // was a drag
  setPointer(e);
  if (S.placing){ updateAim(); confirmPlace(); return; }
  raycaster.setFromCamera(S.pointer, camera);
  const hit = pickFromRay(raycaster.ray.origin.clone(), raycaster.ray.direction.clone());
  hit ? select(hit) : deselect();
});

/* =========================================================
   LOOP
   ========================================================= */
const easeOutBack = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
function animate(now){
  for (const o of items.children){
    const t0 = o.userData.popT0; if (t0 == null) continue;
    const p = RM ? 1 : (now - t0) / 520;
    if (p < 0) continue;
    if (p >= 1){ o.scale.setScalar(1); o.userData.popT0 = null; continue; }
    o.scale.setScalar(Math.max(0.001, easeOutBack(p)));
  }
  if (S.wallAnim != null){
    const p = RM ? 1 : Math.min(1, (now - S.wallAnim) / 750);
    setWallReveal(1 - Math.pow(1-p, 3));
    if (p >= 1) S.wallAnim = null;
  }
}
renderer.setAnimationLoop((t, frame) => {
  if (frame && hitSource && S.mode === 'scan') handleHits(frame);
  if (S.placing) updateAim();
  animate(performance.now());
  if (!S.ar && controls.enabled) controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =========================================================
   WIRING
   ========================================================= */
// Taps on our UI panels must not also count as taps in the AR scene.
document.querySelectorAll('.xr-block').forEach(el => el.addEventListener('beforexrselect', e => e.preventDefault()));

$('#btnAR').addEventListener('click', startAR);
$('#btnPreview').addEventListener('click', startPreview);
$('#btnExit').addEventListener('click', () => { if (xrSession) xrSession.end(); else goIntro(); });
$('#btnRescan').addEventListener('click', () => enterScan('wall'));
$('#btnLock').addEventListener('click', lock);
$('#btnRoom').addEventListener('click', viewInRoom);
$('#btnAlt').addEventListener('click', () => { S.scanMethod = 'floor'; S.scanTarget = 'floor'; S.candidate = null; S.found = false; updateScanUI(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { S.tab = t.dataset.tab; renderTray(); $('#tray').scrollLeft = 0; }));
$('#objBar').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) onAct(b.dataset.act); });
$('#tray').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.preset) applyPreset(PRESETS.find(p => p.id === b.dataset.preset));
  else if (b.dataset.wall){ setWallpaper(b.dataset.wall); S.preset = null; renderTray(); updateTotal(); }
  else if (b.dataset.add) startPlacing(makeItem(b.dataset.add, 0), true);
  else if (b.dataset.w){ S.wallW = clamp(+(S.wallW + parseFloat(b.dataset.w)).toFixed(1), 1.8, 6); setWallReveal(1); renderTray(); updateTotal(); }
});

// Intro: hanging wallpaper sample strips
$('#book').innerHTML = ['blockprint','arches','cane','limewash','terrazzo','indigo']
  .map((id,i) => `<div class="strip" style="background-image:url(${thumb(id)});--h:${[78,92,70,96,84,74][i]}%;--d:${i*70}ms"></div>`).join('');

(async function checkSupport(){
  let ok = false;
  try { ok = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) {}
  const note = $('#support');
  if (ok){ note.textContent = 'AR is ready on this phone. Stand 1.5–2 m from a wall with good light.'; return; }
  $('#btnAR').disabled = true;
  $('#btnAR').classList.remove('primary'); $('#btnPreview').classList.add('primary');
  if (QL){
    $('#btnAR').hidden = true; $('#btnPreview').textContent = 'Style a room';
    note.textContent = 'On iPhone: style the room first, then tap "View in your room" to see it in AR.';
    return;
  }
  note.textContent = !window.isSecureContext
    ? 'AR needs a secure https link. Host this file (for example on Netlify) and open that link on your phone.'
    : 'This browser cannot run WebAR. Open the link in Chrome on an ARCore-supported Android phone, or use the 3D preview.';
})();

showUI('intro');
</script>
